<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BROTHERHOOD - Dabalo</title>
<style>
*{box-sizing:border-box}
body{background:#050a08;color:#fff;font-family:system-ui;padding:12px;margin:0}
.card{background:#111f19;border:1px solid #1c3a2d;border-radius:20px;padding:20px;margin-bottom:14px}
h1{margin:0;color:#4ade80;font-size:26px;font-weight:900}
.sub1{color:#4ade80;font-size:14px}
.total{font-size:38px;font-weight:900;margin:10px 0}
.item{display:flex;justify-content:space-between;padding:14px 0;border-bottom:1px solid #1a2e23;align-items:center}
.dot{width:38px;height:38px;background:#1e3a2d;color:#4ade80;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:12px}
.amount{color:#4ade80;font-weight:900;font-size:15px}
</style>
</head>
<body>
<div class="card">
<h1>BROTHERHOOD</h1>
<div class="sub1">Dabalo Youth Fund • Mchango wa Vijana</div>
<div style="margin-top:16px;color:#8aa99a;font-size:13px">Jumla Iliyokusanywa</div>
<div class="total" id="jumla">0 TZS</div>
<div style="color:#cde9d8;font-size:13px"><span id="idadi">0</span> Wachangiaji • M-Pesa: 0625167946 ELIKA KAHULULE</div>
</div>

<div class="card">
<div style="font-weight:800;font-size:18px;margin-bottom:12px">Orodha ya Wachangiaji <span id="count" style="float:right;color:#4ade80"></span></div>
<div id="orodha"></div>
</div>

<script>
let data = JSON.parse(localStorage.getItem('brotherhood_FINAL_v3')||'[]');
function update(){
 let jumla=0; data.forEach(d=>jumla+=Number(d.kiasi||0));
 document.getElementById('jumla').innerText=jumla.toLocaleString()+' TZS';
 document.getElementById('idadi').innerText=data.length;
 document.getElementById('count').innerText=data.length+'';
 let html='';
 if(data.length==0) html='<div style="text-align:center;color:#555;padding:30px">Bado hakuna mchango.<br>Admin ataweka hivi karibuni.</div>';
 else data.slice().reverse().forEach(d=>{
   let ini=d.majina.split(' ').map(x=>x[0]).slice(0,2).join('').toUpperCase();
   html+=`<div class="item"><div style="display:flex;gap:10px;align-items:center"><div class="dot">${ini}</div><div><div style="font-weight:700">${d.majina}</div><div style="font-size:11px;color:#7a9a8a">${d.namba} • ${d.time}</div></div></div><div class="amount">${Number(d.kiasi).toLocaleString()} TZS</div></div>`;
 });
 document.getElementById('orodha').innerHTML=html;
}
update();
setInterval(update,2000);
</script>
</body>
</html>
