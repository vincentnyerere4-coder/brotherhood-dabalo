<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BROTHERHOOD - Dabalo</title>
<style>
body{background:#0a0f0d;color:#fff;font-family:system-ui;padding:12px;margin:0}
.card{background:#131f1b;border:1px solid #1f3d2f;border-radius:16px;padding:18px;margin-bottom:12px}
h1{margin:0;color:#4ade80;font-size:22px}
.green{color:#4ade80;font-size:13px}
.total{font-size:34px;font-weight:900;margin:8px 0}
label{font-size:13px;color:#aaa}
input,select{width:100%;padding:13px;margin:6px 0 14px 0;border-radius:10px;border:1px solid #2a4a3a;background:#1e2e28;color:#fff;box-sizing:border-box}
button{width:100%;padding:16px;background:#4ade80;color:#000;font-weight:900;border-radius:12px;border:none;font-size:17px}
small{color:#777}
</style>
</head>
<body>
<div class="card">
<h1>BROTHERHOOD</h1>
<div class="green">Dabalo Youth Fund • Mchango wa Vijana</div>
<div style="margin-top:12px">Jumla Iliyokusanywa</div>
<div class="total" id="jumla">0 TZS</div>
<div><span id="idadi">0</span> Contributors</div>
</div>
<div class="card">
<h3>Send Donation +</h3>
<label>Three Names *</label>
<input id="majina" placeholder="Ex: Alexander Bahat Masinga">
<label>Your Phone Number *</label>
<input id="namba" placeholder="07XX XXX XXX">
<label>Amount (TZS) - Minimum 5,000 *</label>
<input id="kiasi" type="number" min="5000" placeholder="5000">
<label>M-Pesa Transaction ID (Baada ya kutuma)</label>
<input id="txid" placeholder="Mf: TH34RT... (Hiari)">
<button onclick="tuma()">Send Donation</button>
<p style="text-align:center;font-size:12px;color:#4ade80;margin-top:12px;font-weight:bold">M-Pesa: 0625167946 ELIKA KAHULULE</p>
</div>
<script>
let data = JSON.parse(localStorage.getItem('brotherhood_v2')||'[]');
function update(){
 let jumla=0; data.forEach(d=>jumla+=Number(d.kiasi||0));
 document.getElementById('jumla').innerText=jumla.toLocaleString()+' TZS';
 document.getElementById('idadi').innerText=data.length;
}
function tuma(){
 let majina=document.getElementById('majina').value.trim();
 let namba=document.getElementById('namba').value.trim();
 let kiasi=Number(document.getElementById('kiasi').value);
 let txid=document.getElementById('txid').value.trim();
 if(!majina||!namba||!kiasi){alert('Jaza majina, namba na kiasi');return;}
 if(kiasi<5000){alert('Kiasi cha chini ni 5,000 TZS');return;}
 let rec={majina,namba,kiasi,txid:txid||'HAIJATHIBITISHWA',time:new Date().toLocaleString(),status:'Pending Verify'};
 data.push(rec);
 localStorage.setItem('brotherhood_v2',JSON.stringify(data));
 update();
 let mpesaNumber="0625167946";
 let ussd=`*150*00*1*${mpesaNumber}*${kiasi}#`;
 if(confirm(`Asante ${majina}! Kiasi ${kiasi} TZS. Bonyeza OK kufungua M-Pesa kulipia ELIKA KAHULULE. Baada ya kulipa rudi hapa uweke Transaction ID.`)){
   window.location.href=`tel:${encodeURIComponent(ussd)}`;
 }
 document.getElementById('majina').value='';document.getElementById('namba').value='';document.getElementById('kiasi').value='';document.getElementById('txid').value='';
}
update();
</script>
</body>
</html>
